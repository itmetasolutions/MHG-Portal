version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landlord_registry}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-landlord_registry}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-landlord_registry}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-session_token}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      OTP_EMAIL_FROM: ${OTP_EMAIL_FROM:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_MAX_SENDS_PER_WINDOW: ${OTP_MAX_SENDS_PER_WINDOW:-5}
      OTP_SEND_WINDOW_MINUTES: ${OTP_SEND_WINDOW_MINUTES:-10}
      OTP_MAX_VERIFY_ATTEMPTS_PER_CODE: ${OTP_MAX_VERIFY_ATTEMPTS_PER_CODE:-5}
      OTP_MAX_VERIFY_ATTEMPTS_PER_WINDOW: ${OTP_MAX_VERIFY_ATTEMPTS_PER_WINDOW:-10}
      OTP_VERIFY_WINDOW_MINUTES: ${OTP_VERIFY_WINDOW_MINUTES:-10}
      ALLOW_ADMIN_PASSIVE_REVERT: ${ALLOW_ADMIN_PASSIVE_REVERT:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RUN_SEED: ${RUN_SEED:-false}
    command: ["sh", "/app/docker/start.sh"]

volumes:
  postgres_data:
